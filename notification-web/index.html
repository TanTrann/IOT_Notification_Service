<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartFarm — Thông báo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #eef3f0; --card: #fff; --text: #1e2a26; --muted: #6b7a74;
      --brand: #1f8a4c; --brand-dark: #176e3c;
      --info: #2d7ff9; --warning: #e8930c; --critical: #e0442e;
      --border: #e2e8e5;
    }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    [hidden] { display: none !important; }

    /* ── Màn đăng nhập ───────────────────────── */
    #login-view { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .login-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px; width: min(380px, 100%); box-shadow: 0 8px 30px rgba(0,0,0,.06); }
    .login-card h1 { font-size: 1.25rem; margin-bottom: 4px; }
    .login-card p { font-size: .85rem; color: var(--muted); margin-bottom: 16px; }
    label { display: block; font-size: .78rem; color: var(--muted); margin: 10px 0 4px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: .9rem; background: #fafcfb; color: var(--text); }
    .btn { padding: 8px 12px; background: var(--brand); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: .85rem; font-weight: 600; }
    .btn:hover { background: var(--brand-dark); }
    .btn:disabled { opacity: .6; cursor: default; }
    .btn.block { width: 100%; padding: 11px; margin-top: 16px; }
    .btn.ghost { background: transparent; color: var(--brand-dark); border: 1px solid var(--border); }
    .btn.ghost:hover { background: #eef4f0; }
    .err { color: var(--critical); font-size: .82rem; margin-top: 10px; min-height: 1em; }

    /* ── Thanh trên ─────────────────────────── */
    header {
      display: flex; align-items: center; gap: 10px; padding: 12px 18px;
      background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20;
    }
    header .logo { font-size: 1.4rem; }
    header h1 { font-size: 1.1rem; font-weight: 700; flex: 1; }
    .icon-btn {
      position: relative; background: #f2f6f4; border: 1px solid var(--border); cursor: pointer;
      border-radius: 10px; padding: 7px 11px; font-size: .95rem; display: flex; align-items: center; gap: 7px; color: var(--text);
    }
    .icon-btn:hover { background: #e7efe9; }
    .u-label { font-size: .85rem; font-weight: 600; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badge-count {
      position: absolute; top: -6px; right: -6px; background: var(--critical); color: #fff;
      font-size: .66rem; font-weight: 700; border-radius: 999px; padding: 1px 6px; min-width: 18px; text-align: center;
    }
    .menu {
      position: absolute; top: 58px; right: 16px; width: 240px; z-index: 30; background: var(--card);
      border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.16); padding: 12px;
    }
    .menu .who { font-size: .8rem; color: var(--muted); margin-bottom: 8px; word-break: break-all; }
    .menu .btn { width: 100%; margin-top: 6px; }
    .fcm-state { font-size: .74rem; color: var(--muted); margin-top: 8px; }
    .fcm-state.on { color: var(--brand-dark); font-weight: 600; }

    /* ── Bộ lọc + danh sách ─────────────────── */
    main { max-width: 760px; margin: 0 auto; padding: 18px 16px 40px; }
    .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
    .chip { border: 1px solid #cfdcd5; background: var(--card); border-radius: 999px; padding: 5px 12px; font-size: .82rem; cursor: pointer; color: var(--text); }
    .chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }
    .noti {
      display: flex; gap: 10px; background: var(--card); border: 1px solid var(--border);
      border-left-width: 4px; border-radius: 10px; padding: 11px 13px; margin-bottom: 8px; cursor: pointer;
    }
    .noti:hover { background: #fafdfb; }
    .noti.sev-info { border-left-color: var(--info); }
    .noti.sev-warning { border-left-color: var(--warning); }
    .noti.sev-critical { border-left-color: var(--critical); }
    .noti.read { opacity: .65; }
    .noti .icon { font-size: 1.25rem; line-height: 1.4; }
    .noti .content { flex: 1; min-width: 0; }
    .noti .title { font-size: .92rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .noti .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--critical); flex-shrink: 0; }
    .noti .body { font-size: .84rem; color: var(--muted); margin-top: 3px; word-wrap: break-word; }
    .noti .meta { font-size: .74rem; color: #98a6a0; margin-top: 5px; }
    .empty { text-align: center; color: var(--muted); padding: 40px 12px; font-size: .9rem; line-height: 1.5; }
    #more { display: block; margin: 12px auto 0; }

    /* ── Toast ─────────────────────────────── */
    #toast-zone { position: fixed; bottom: 20px; right: 20px; z-index: 99; display: flex; flex-direction: column; gap: 10px; }
    .toast { background: var(--text); color: #fff; border-radius: 10px; padding: 12px 16px; max-width: 320px; box-shadow: 0 6px 24px rgba(0,0,0,.25); font-size: .85rem; animation: slidein .25s ease; }
    .toast b { display: block; margin-bottom: 2px; }
    @keyframes slidein { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  </style>
</head>
<body>
  <!-- Đăng nhập bằng tài khoản server Phong -->
  <div id="login-view" hidden>
    <form class="login-card" id="login-form">
      <h1>🌱 SmartFarm</h1>
      <p>Đăng nhập bằng tài khoản hệ thống cây (server Phong).</p>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required />
      <label for="password">Mật khẩu</label>
      <input id="password" type="password" autocomplete="current-password" required />
      <button class="btn block" id="login-btn" type="submit">Đăng nhập</button>
      <div class="err" id="login-err"></div>
    </form>
  </div>

  <!-- Trang thông báo (bố cục A: một danh sách + nút lọc) -->
  <div id="app-view" hidden>
    <header>
      <span class="logo">🌱</span>
      <h1>SmartFarm</h1>
      <button class="icon-btn" id="bell-btn" title="Chưa đọc">🔔<span class="badge-count" id="unread-badge" hidden>0</span></button>
      <button class="icon-btn" id="user-btn" title="Tài khoản">👤<span class="u-label" id="user-label"></span></button>
    </header>
    <div class="menu" id="user-menu" hidden>
      <div class="who" id="menu-who"></div>
      <button class="btn ghost" id="push-btn">🔔 Bật nhận push</button>
      <button class="btn ghost" id="logout-btn">Đăng xuất</button>
      <div class="fcm-state" id="fcm-state"></div>
    </div>

    <main>
      <div class="toolbar">
        <div class="chips" id="chips"></div>
        <button class="btn ghost" id="read-all-btn">✓ Đọc tất cả</button>
      </div>
      <div id="list"></div>
      <button class="btn ghost" id="more" hidden>Xem thêm</button>
    </main>
  </div>

  <div id="toast-zone"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>
<script>
// ── Địa chỉ server — đổi môi trường thì sửa 2 dòng này (giống cách web quản lý của team Frontend làm) ──
const PLANT_API_URL = 'http://localhost:8000';   // server .NET của Phong: đăng nhập + quyền xem cây
const NOTIFY_URL    = 'http://localhost:3001';   // IOT Notification Service

// ── Firebase project config (khớp firebase-messaging-sw.js) ────────────────
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCUaUnwE20Gi9V35CX9CkcDmqwwxFYZiNI",
  authDomain: "smartfarmai-f1426.firebaseapp.com",
  projectId: "smartfarmai-f1426",
  messagingSenderId: "1071313553757",
  appId: "1:1071313553757:web:d9ad58188bcde720ca80b4",
};
const VAPID_KEY = "BNOC91dgjosxTi-sHV8HaeTx3jKUAUwVAvyWY4tMc_zbMuoMmad0r1h3Rodl92k2bM_E6y4OmHiLP9jSsJ26G6Q";

const TYPE_ICON = { water: '💧', light: '💡', temperature: '🌡️', nutrition: '🌱', disease: '🦠', system: '⚙️' };
const PAGE_SIZE = 20;

// Trang này GIẢ LẬP web quản lý của team Frontend: chỉ dùng đúng những gì được bàn giao
// (đăng nhập Phong → JWT → /api/v1/* của Notify → FCM web). Không dùng API key nội bộ.
let session = null;              // { token, email, displayName }
let devices = [];                // [{ deviceId, name }] từ GET /api/v1/me
let filter = { deviceId: '', unread: false };
let items = [];
let page = 1;
let messaging = null;
let fcmToken = null;

function $(id) { return document.getElementById(id); }
function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }
function timeAgo(iso) {
  const s = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (s < 60) return 'vừa xong';
  if (s < 3600) return `${Math.floor(s / 60)} phút trước`;
  if (s < 86400) return `${Math.floor(s / 3600)} giờ trước`;
  return new Date(iso).toLocaleString('vi-VN');
}
function toast(title, body) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<b>${esc(title)}</b>${esc(body)}`;
  $('toast-zone').appendChild(t);
  setTimeout(() => t.remove(), 6000);
}
function deviceName(id) { return devices.find(d => d.deviceId === id)?.name || id; }

// ── Gọi Notify: gắn Bearer JWT; 401 → phiên hết hạn, quay về màn đăng nhập ──
async function notify(path, opts = {}) {
  const r = await fetch(`${NOTIFY_URL}/api/v1${path}`, {
    ...opts,
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session?.token}`, ...(opts.headers || {}) },
  });
  const json = await r.json().catch(() => ({}));
  if (r.status === 401) { endSession(); throw new Error('Phiên đăng nhập hết hạn'); }
  if (!r.ok) throw new Error(json.message || `HTTP ${r.status}`);
  return json;
}

// ── Phiên đăng nhập ──────────────────────────────────────────────────────────
function loadSession() {
  try { session = JSON.parse(localStorage.getItem('notiweb-session') || 'null'); } catch { session = null; }
}
function endSession() {
  // Xoá MỌI trạng thái theo người dùng — máy dùng chung, người sau không được dính bộ lọc/push của người trước.
  session = null; devices = []; items = []; page = 1;
  filter = { deviceId: '', unread: false };
  fcmToken = null;
  $('fcm-state').textContent = '';
  $('fcm-state').className = 'fcm-state';
  $('list').innerHTML = '';
  localStorage.removeItem('notiweb-session');
  showView();
}
function showView() {
  $('login-view').hidden = !!session;
  $('app-view').hidden = !session;
}

$('login-form').onsubmit = async (e) => {
  e.preventDefault();
  $('login-err').textContent = '';
  $('login-btn').disabled = true;
  try {
    const r = await fetch(`${PLANT_API_URL}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: $('email').value.trim(), password: $('password').value }),
    });
    if (!r.ok) throw new Error(r.status === 401 ? 'Sai email hoặc mật khẩu' : `Đăng nhập lỗi (HTTP ${r.status})`);
    const j = await r.json();
    session = { token: j.token, email: j.email, displayName: j.displayName };
    localStorage.setItem('notiweb-session', JSON.stringify(session));
    $('password').value = '';
    await startApp();
  } catch (err) {
    $('login-err').textContent = err.message === 'Failed to fetch' ? `Không kết nối được ${PLANT_API_URL}` : err.message;
  } finally {
    $('login-btn').disabled = false;
  }
};

async function logout() {
  // Hủy FCM token TRƯỚC khi bỏ JWT → máy này ngừng nhận push của tài khoản ngay.
  // Lấy lại token kể cả khi lần mở trang này chưa bật push (vd /me lỗi lúc khởi động),
  // rồi xoá luôn token ở trình duyệt: dù server còn giữ, FCM cũng không giao tới máy này nữa.
  try {
    if ('Notification' in window && Notification.permission === 'granted') {
      if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      if (!messaging) messaging = firebase.messaging();
      if (!fcmToken) {
        const swReg = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
        fcmToken = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: swReg });
      }
      await notify('/push/token', { method: 'DELETE', body: JSON.stringify({ token: fcmToken }) }).catch(() => {});
      await messaging.deleteToken().catch(() => {});
    }
  } catch (e) { console.warn('Hủy push khi đăng xuất lỗi:', e.message); }
  $('user-menu').hidden = true;
  endSession();
}

// ── Khởi động sau đăng nhập ─────────────────────────────────────────────────
async function startApp() {
  showView();
  $('user-label').textContent = session.displayName || session.email;
  $('menu-who').textContent = session.email;
  try {
    devices = (await notify('/me')).devices || [];
  } catch (e) {
    if (session) toast('Không tải được danh sách cây', e.message);
    return;
  }
  renderChips();
  await reload();
  // Đã từng cho phép push → đăng ký lại token với JWT mới (để server lưu JWT còn hạn).
  if ('Notification' in window && Notification.permission === 'granted') enablePush(true);
}

// ── Danh sách ────────────────────────────────────────────────────────────────
function query(p) {
  const q = new URLSearchParams({ page: p, limit: PAGE_SIZE });
  if (filter.deviceId) q.set('deviceId', filter.deviceId);
  if (filter.unread) q.set('unread', 'true');
  return `/notifications?${q}`;
}
async function reload() {
  page = 1;
  try {
    const res = await notify(query(1));
    items = res.items; render(res);
  } catch (e) { if (session) toast('Lỗi tải thông báo', e.message); }
}
async function loadMore() {
  try {
    const res = await notify(query(page + 1));
    page += 1; items = items.concat(res.items); render(res);
  } catch (e) { toast('Lỗi tải thêm', e.message); }
}

function renderChips() {
  const chips = [{ label: 'Tất cả', on: !filter.deviceId && !filter.unread, set: { deviceId: '', unread: false } }]
    .concat(devices.map(d => ({ label: d.name, on: filter.deviceId === d.deviceId, set: { deviceId: d.deviceId, unread: filter.unread } })))
    .concat([{ label: 'Chưa đọc', on: filter.unread, set: { deviceId: filter.deviceId, unread: !filter.unread } }]);
  const box = $('chips');
  box.innerHTML = '';
  for (const c of chips) {
    const b = document.createElement('button');
    b.className = 'chip' + (c.on ? ' on' : '');
    b.textContent = c.label;
    b.onclick = () => { filter = c.set; renderChips(); reload(); };
    box.appendChild(b);
  }
}

function render(res) {
  const badge = $('unread-badge');
  badge.hidden = !res.unreadCount;
  badge.textContent = res.unreadCount > 99 ? '99+' : res.unreadCount;
  $('more').hidden = !res.hasMore;

  const list = $('list');
  if (!items.length) {
    list.innerHTML = devices.length
      ? '<div class="empty">Chưa có thông báo nào.</div>'
      : '<div class="empty">Tài khoản này chưa sở hữu hoặc được chia sẻ cây nào.</div>';
    return;
  }
  list.innerHTML = '';
  for (const n of items) {
    const el = document.createElement('div');
    el.className = `noti sev-${n.severity || 'info'}${n.isRead ? ' read' : ''}`;
    el.innerHTML = `
      <div class="icon">${TYPE_ICON[n.type] || '🔔'}</div>
      <div class="content">
        <div class="title"><span>${esc(n.title)}</span>${n.isRead ? '' : '<span class="dot"></span>'}</div>
        ${n.body ? `<div class="body">${esc(n.body)}</div>` : ''}
        <div class="meta">${esc(deviceName(n.deviceId))} · ${timeAgo(n.createdAt)}</div>
      </div>`;
    el.onclick = () => markRead(n);
    list.appendChild(el);
  }
}

async function markRead(n) {
  if (n.isRead) return;
  try { await notify(`/notifications/${n._id}/read`, { method: 'PATCH' }); await reload(); }
  catch (e) { toast('Lỗi', e.message); }
}
async function markAllRead() {
  const q = filter.deviceId ? `?deviceId=${encodeURIComponent(filter.deviceId)}` : '';
  try { await notify(`/notifications/read-all${q}`, { method: 'PATCH' }); await reload(); }
  catch (e) { toast('Lỗi', e.message); }
}

// ── Push (FCM web) ───────────────────────────────────────────────────────────
async function enablePush(silent = false) {
  try {
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') return toast('Bị từ chối', 'Trình duyệt không cho phép hiện thông báo.');
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    if (!messaging) {
      messaging = firebase.messaging();
      messaging.onMessage(onPush);
    }
    const swReg = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
    fcmToken = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: swReg });
    // Token gắn với TÀI KHOẢN đang đăng nhập; server tự kiểm quyền xem cây mỗi lần gửi.
    await notify('/push/token', { method: 'POST', body: JSON.stringify({ token: fcmToken, device: 'web' }) });
    $('fcm-state').textContent = 'Push: đang bật';
    $('fcm-state').className = 'fcm-state on';
    if (!silent) toast('Sẵn sàng 🔔', 'Đã bật nhận thông báo.');
  } catch (e) { if (session) toast('Lỗi bật push', e.message); }
}

function onPush(payload) {
  const note = payload.notification || {};
  const data = payload.data || {};
  toast(note.title || data.title || 'Thông báo', note.body || data.body || '');
  reload();
}

// Tin đến khi tab ở nền: service worker chuyển sang đây để cập nhật danh sách.
if (navigator.serviceWorker) {
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data && e.data.type === 'fcm' && session) reload();
  });
}

// ── Sự kiện giao diện ────────────────────────────────────────────────────────
$('user-btn').onclick = (e) => {
  e.stopPropagation();
  $('user-menu').hidden = !$('user-menu').hidden;
  if (!$('fcm-state').classList.contains('on')) {
    $('fcm-state').textContent = `Push: ${'Notification' in window && Notification.permission === 'granted' ? 'quyền đã cấp' : 'chưa bật'}`;
  }
};
$('bell-btn').onclick = () => { filter = { deviceId: '', unread: true }; renderChips(); reload(); };
document.addEventListener('click', (e) => { if (!e.target.closest('.menu')) $('user-menu').hidden = true; });
$('push-btn').onclick = () => enablePush();
$('logout-btn').onclick = () => logout();
$('read-all-btn').onclick = () => markAllRead();
$('more').onclick = () => loadMore();

// ── Boot ──────────────────────────────────────────────────────────────────────
loadSession();
showView();
if (session) startApp();
</script>
</body>
</html>
